project: "[[tela-park]]"
type: checklist
phase: deployment
status: in_progress

# Tela Park deployment — Basic+2 plan, Pro build on 8 of 14 courts. Live.
# No rack, no Kisi, no NVR. Network is the client's distributed design (UDM-SE + client fiber LAN
# + client-bought PoE pole switches), maintained by Tela Park. Replays reach the
# Mac mini through a Cloudflare Tunnel; no inbound ports.

categories:

  - name: Court Information
    items:
      - label: Total court count confirmed
        done: true
        notes: "14 total; 8 Pro-equipped (Championship 1–2, Premium 3–8); Standard 1–6 software-only"
      - label: Court numbering scheme defined
        done: true
        notes: "Court number = name number; Mosyle names AppleTV CH1 / iPad P3 etc.; camera IDs on the Mini stay championship-court-1..2, premium-court-1..6"
      - label: Pole ↔ court mapping confirmed with client
        done: true
        notes: "Client's build; the pole mapping itself isn't recorded by Kosmas. Camera .3N = court N, confirmed from each frame"
      - label: Layout diagram with cable run distances
        done: false

  - name: Hardware
    items:
      - label: Court kit quoted (8 courts)
        done: true
      - label: Court kit delivered to the venue
        done: true
        notes: "Cameras, TVs, iPads, adapters, mounts, Apple TVs, 18 Flics, Mac mini, SSD, UDM-SE, 4× U7-LR"
      - label: Switches sourced
        done: true
        notes: "Client bought their own; the Kosmas USW-Flex + 5× USW-Lite-8-PoE are unused stock"
      - label: Replay SSD in hand
        done: true
        notes: "Kingston XS1000 2TB"
      - label: Apple TVs — all 8 Ethernet (128GB) units confirmed
        done: true
      - label: Aluminum signs sourced (16)
        done: false
        notes: "Custom printed signs pending; Flic mounting waits on them"
      - label: UPS scope decided (client vs Kosmas; placements)
        done: true
        notes: "Tela Park buys, places and maintains them; not tracked by Kosmas"

  - name: Camera Mounting
    items:
      - label: Custom mounts in fabrication
        done: true
      - label: Cabling run under concrete by facility owners
        done: true
      - label: Cameras mounted
        done: true
      - label: Cameras re-aimed and lens-calibrated
        done: false
        notes: "Championship 1 done; seven to go"

  - name: TV / Monitor (Instant Replay)
    items:
      - label: TVs and Apple TVs mounted, back-to-back per court
        done: true
        notes: "Mounted by Tela Park to PodPlay's specs"
      - label: Replay shows on each court's TV
        done: true

  - name: Network & Internet
    items:
      - label: ISP confirmed
        done: true
        notes: "PLDT Home Fiber, public dynamic IP"
      - label: Non-CGNAT verified
        done: true
        notes: "By traceroute; no longer matters with the tunnel"
      - label: Client LAN does not overlap 192.168.32.x / .30.x
        done: true
        notes: "Default moved to .30 because the PLDT modem LAN is .1.x"
      - label: REPLAY VLAN 32 created and trunked across the switches
        done: true
        notes: "Uplinks Default untagged + REPLAY tagged; court ports native REPLAY; Allow Internet ON, Isolate OFF"
      - label: Fixed IPs for all devices
        done: true
        notes: "Apple TVs .11–.18, iPads .21–.28 (adapter MAC), cameras .31–.38, Mac mini .100 — blocks chosen by Tela Park IT"
      - label: mDNS verified — each iPad finds its court's Apple TV across the pole switches
        done: false
        notes: "Not recorded as a separate check"
      - label: Network handed to Tela Park, UI.com ownership kept by Kosmas
        done: true
        notes: "unifi@podplay.app invited"

  - name: Replay Path & Monitoring
    items:
      - label: Cloudflare Tunnel live (https://replay-telapark.fnasasin.com)
        done: true
        notes: "Outbound TCP/UDP 7844 must stay open on REPLAY"
      - label: Old port-4000 forward + DDNS removed
        done: true
        notes: "UDM-SE forward, DDNS cron, DNS record and its token"
      - label: External health check from cellular
        done: true
      - label: Uptime monitoring + alerts
        done: true
        notes: "Better Stack on /health every 3 min, email"

  - name: Mac mini & Replay Service
    items:
      - label: Headless server prep (SSH + Screen Sharing on, Remote Management off, no sleep, FileVault off, Wi-Fi off)
        done: true
      - label: Auto-login ON, screen lock OFF, Full Disk Access on the replay service
        done: true
      - label: Replay SSD erased as Replays (APFS, GUID) and headless automount daemon installed
        done: true
        notes: "Plug the SSD in before powering the Mini"
      - label: Mac mini bound to 192.168.32.100
        done: true
        notes: "Set by hand with DNS 1.1.1.1 8.8.8.8"
      - label: Dashboard venue settings (server URL, local IP, cameras, auto-cleanup)
        done: true
      - label: Replay service deployed and running
        done: true
        notes: "On 2.1.2; recheck the upload key after every self-update"
      - label: Saved replays working end to end
        done: true
      - label: Remote admin — Teleport verified into the REPLAY VLAN
        done: true
        notes: "Teleport only"

  - name: Cameras (Uniview Owlview)
    items:
      - label: 8 units activated, credentialed, encoding/audio/OSD configured
        done: true
      - label: Illumination set to IR (not white light)
        done: true
      - label: Re-IP each camera onto the .32 block (.31 … .38)
        done: true
      - label: RTSP verified from all 8 on-site
        done: true

  - name: iPads & Apple TVs
    items:
      - label: iPads enrolled in Mosyle
        done: true
      - label: Apple TVs enrolled in Mosyle
        done: true
        notes: "All 8, handed over"
      - label: Mosyle names and court numbers set on all 16 devices
        done: true
      - label: Flic buttons paired, 2 per court
        done: true
      - label: Flic buttons mounted
        done: false
        notes: "Waiting on the aluminium signs"
      - label: App Lock turned on on the iPads
        done: false
        notes: "After the Flics are mounted"

  - name: Power
    items:
      - label: Voltage confirmed 220V / 60Hz
        done: true
      - label: 220 V at each pole confirmed
        done: true

  - name: Facility Access
    items:
      - label: Client IT contact identified
        done: true
        notes: "Mark Colona"
      - label: Responsibility split documented
        done: true
        notes: "Tela Park = network + PLDT edge + UPS + mounting; Kosmas = Mac mini, replay service, dashboard, Mosyle, Cloudflare"

  - name: Signage & Branding
    items:
      - label: Venue logo received (for replay overlay)
        done: false
      - label: Exact venue name confirmed for dashboard
        done: true
        notes: "Tenant id telapark (not the venue slug las-pinas)"

  - name: Regional (Philippines)
    items:
      - label: Timezone Asia/Manila
        done: true
      - label: Video standard NTSC / 60 Hz anti-flicker set on cameras
        done: false
      - label: Payment terminal configured for GCash / Magpie
        done: false

  - name: Commercial
    items:
      - label: Billing basis confirmed with PodPlay (8 or 14 courts)
        done: false
      - label: Contract counterpart signed
        done: false
      - label: Apple devices from PodPlay paid / billed
        done: false
        notes: "See tickets/tela-park-apple-device-payment.md"
