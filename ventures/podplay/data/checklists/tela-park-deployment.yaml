# Tela Park deployment — Basic+2 plan, Pro build on 8 of 14 courts.
# No rack, no Kisi, no NVR. Network is the client's distributed design (UDM-SE + fiber switch
# + 5 pole switches), Kosmas-purchased and Kosmas-configured on-site.

