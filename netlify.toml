# Kosmas marketing site (KAN-22) — plain static site, no build step.
# Netlify publishes only general/company/website/site/ ; working/ artifacts stay private.
[build]
  publish = "general/company/website/site"
  command = ""
  # Only redeploy when the site itself changes, not on every data/task sync commit.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- general/company/website/site netlify.toml"

# Images change rarely; cache for a week, serve stale while revalidating.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Code files: cache briefly so fixes propagate fast.
[[headers]]
  for = "/*.jsx"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
